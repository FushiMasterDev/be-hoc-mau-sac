<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bé Học Màu Sắc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="card">
  <section id="start">
    <div class="dots" aria-hidden="true">
      <i style="background:#EF4444"></i><i style="background:#F59E0B"></i><i style="background:#22C55E"></i><i style="background:#3B82F6"></i><i style="background:#A855F7"></i>
    </div>
    <h1><span>Bé</span> <span>Học</span> <span>Màu</span> <span>Sắc</span> <span>!</span></h1>
    <p>10 câu hỏi về màu của các loại quả — bật loa để nghe cô đọc nhé</p>
    <button class="btn" id="startBtn">Bắt đầu</button>
    <br><a class="other" href="nhan-biet-qua.html">Chơi trò Bé Nhận Biết Quả →</a>
  </section>

  <section id="quiz" hidden>
    <div class="top">
      <span id="count">Câu 1/10</span>
      <button class="replay" id="replayBtn" aria-label="Nghe lại câu hỏi">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        Nghe lại
      </button>
      <span id="points">⭐ 0</span>
    </div>
    <div class="bar" aria-hidden="true"><div id="progress"></div></div>
    <div class="question" id="qText"></div>
    <div class="fruit" id="show" aria-hidden="true"></div>
    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback" aria-live="polite"></div>
  </section>

  <section id="result" hidden>
    <h1><span>Giỏi</span> <span>quá</span><span>!</span></h1>
    <div class="score" id="finalScore"></div>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <p id="resultMsg"></p>
    <button class="btn" id="againBtn">Chơi lại</button>
    <br><a class="other" href="nhan-biet-qua.html">Chơi trò Bé Nhận Biết Quả →</a>
  </section>
</main>

<script>
const C = { "Đỏ":"#EF4444", "Vàng":"#FACC15", "Xanh lá":"#22C55E", "Xanh dương":"#3B82F6", "Cam":"#F97316",
            "Tím":"#A855F7", "Hồng":"#F472B6", "Nâu":"#92400E", "Đen":"#111827", "Trắng":"#FFFFFF", "Xám":"#9CA3AF" };

// shortcut: fruit pictures are emoji (look differs slightly per device); swap for SVG/PNG if exact art matters.
window.GAME = {
  known: C, audioDir: "audio/mau", readOptions: true, pics: false,
  option(b, name) {
    const dot = document.createElement("span");
    dot.className = "dot"; dot.style.background = C[name]; dot.setAttribute("aria-hidden", "true");
    b.append(dot, name);
  },
  wrongText: q => `Chưa đúng rồi, đó là màu ${q.answer.toLowerCase()}`,
  questions: [
    { show: "🍎", answer: "Đỏ",         q: "Quả táo này có màu gì?",       options: ["Đỏ", "Xanh dương", "Vàng"] },
    { show: "🍌", answer: "Vàng",       q: "Quả chuối này có màu gì?",     options: ["Tím", "Vàng", "Xanh lá"] },
    { show: "🍊", answer: "Cam",        q: "Quả cam này có màu gì?",       options: ["Hồng", "Nâu", "Cam"] },
    { show: "🍇", answer: "Tím",        q: "Chùm nho này có màu gì?",      options: ["Tím", "Vàng", "Xanh dương"] },
    { show: "🍓", answer: "Đỏ",         q: "Quả dâu tây này có màu gì?",   options: ["Xanh dương", "Đỏ", "Đen"] },
    { show: "🍐", answer: "Xanh lá",    q: "Quả lê này có màu gì?",        options: ["Đỏ", "Tím", "Xanh lá"] },
    { show: "🫐", answer: "Xanh dương", q: "Quả việt quất này có màu gì?", options: ["Xanh dương", "Cam", "Hồng"] },
    { show: "🥥", answer: "Nâu",        q: "Quả dừa này có màu gì?",       options: ["Hồng", "Nâu", "Xanh dương"] },
    { show: "🍍", answer: "Vàng",       q: "Quả dứa này có màu gì?",       options: ["Đỏ", "Tím", "Vàng"] },
    { show: "🥝", answer: "Xanh lá",    q: "Quả kiwi này có màu gì?",      options: ["Xanh lá", "Hồng", "Đen"] },
  ],
};
</script>
<script src="quiz.js"></script>
</body>
</html>
